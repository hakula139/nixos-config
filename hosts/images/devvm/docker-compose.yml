# cspell:words netrc

services:
  devvm:
    image: devvm:latest
    container_name: devvm

    # --------------------------------------------------------------------------
    # Container
    # --------------------------------------------------------------------------
    hostname: devvm
    command: /init
    restart: unless-stopped
    privileged: true
    stop_grace_period: 20s

    # --------------------------------------------------------------------------
    # Environment
    # --------------------------------------------------------------------------
    environment:
      USER: root
      HOME: /root
      HOST_HOME: ${HOME}
      HOST_DOCKER_SOCKET: ${XDG_RUNTIME_DIR}/docker.sock
      PATH: /etc/profiles/per-user/root/bin:/root/.nix-profile/bin:/run/wrappers/bin:/nix/var/nix/profiles/default/bin:/run/current-system/sw/bin

    # --------------------------------------------------------------------------
    # Network
    # --------------------------------------------------------------------------
    network_mode: host

    # --------------------------------------------------------------------------
    # Storage
    # --------------------------------------------------------------------------
    volumes:
      - devvm-root:/root

      - /etc/resolv.conf:/etc/resolv.conf:ro
      - /usr/local/share/ca-certificates:/usr/local/share/ca-certificates:ro
      - ~/.claude:/root/.claude
      - ~/.claude.json:/root/.claude.json
      - ~/.codex:/root/.codex
      - ~/.gitconfig:/root/.gitconfig:ro
      - ~/.kube:/root/.kube:ro
      - ~/.netrc:/root/.netrc:ro
      - ~/.ssh:/root/.ssh
      - ~/workspace:/root/workspace
      - ${XDG_RUNTIME_DIR}/docker.sock:/var/run/docker.sock

    tmpfs:
      - /tmp

    # --------------------------------------------------------------------------
    # Resource Tuning
    # --------------------------------------------------------------------------
    shm_size: 128g

    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576

volumes:
  devvm-root:
