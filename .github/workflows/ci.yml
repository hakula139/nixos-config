name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 20 * * *' # Nominally 04:00 Asia/Shanghai; GitHub may delay it
  workflow_dispatch:

env:
  CACHIX_NAME: hakula

jobs:
  flake-check:
    name: Nix Flake Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Nix
        uses: ./.github/actions/setup-nix
        with:
          cache_prefix: flake-check
          cachix_name: ${{ env.CACHIX_NAME }}
          cachix_skip_push: 'true'

      - name: Run flake check
        run: nix flake check --all-systems

  build:
    name: Build ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.runner }}
    needs: flake-check
    strategy:
      fail-fast: false
      matrix:
        config:
          - id: us-1
            deploy: true
            name: us-1 (x86_64-linux, CloudCone SC2)
            runner: ubuntu-latest
            target: .#nixosConfigurations.us-1.config.system.build.toplevel
          - id: us-2
            deploy: true
            name: us-2 (x86_64-linux, CloudCone VPS)
            runner: ubuntu-latest
            target: .#nixosConfigurations.us-2.config.system.build.toplevel
          - id: us-3
            deploy: true
            name: us-3 (x86_64-linux, CloudCone SC2)
            runner: ubuntu-latest
            target: .#nixosConfigurations.us-3.config.system.build.toplevel
          - id: us-4
            deploy: true
            name: us-4 (x86_64-linux, DMIT)
            runner: ubuntu-latest
            target: .#nixosConfigurations.us-4.config.system.build.toplevel
          - id: sg-1
            deploy: true
            name: sg-1 (x86_64-linux, Tencent Lighthouse)
            runner: ubuntu-latest
            target: .#nixosConfigurations.sg-1.config.system.build.toplevel
          - id: wsl
            name: wsl (x86_64-linux, NixOS-WSL)
            runner: ubuntu-latest
            target: .#nixosConfigurations.wsl.config.system.build.toplevel
            cachix_pins:
              wakatime-cli-x86_64-linux: .#nixosConfigurations.wsl.pkgs.wakatime-cli
          - id: wsl-non-nixos
            name: wsl-non-nixos (x86_64-linux, System Manager)
            runner: ubuntu-latest
            target: .#systemConfigs.wsl-non-nixos
          - id: macos
            name: macbook (aarch64-darwin, macOS)
            runner: macos-latest
            target: .#darwinConfigurations.macbook.system
            cachix_pins:
              peertube-runner-aarch64-darwin: .#darwinConfigurations.macbook.pkgs.peertube-runner
              wakatime-cli-aarch64-darwin: .#darwinConfigurations.macbook.pkgs.wakatime-cli
          - id: docker
            name: devvm (x86_64-linux, Docker)
            runner: ubuntu-latest
            target: .#packages.x86_64-linux.devvm-docker

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Nix
        uses: ./.github/actions/setup-nix
        with:
          cache_prefix: ${{ matrix.config.id }}
          cachix_name: ${{ env.CACHIX_NAME }}
          cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          cachix_skip_push: ${{ !(github.ref == 'refs/heads/main' || github.actor == 'hakula139') }}

      - name: Check deployment derivation
        if: matrix.config.deploy
        run: |
          set -euo pipefail
          ci_drv=$(nix eval --raw '${{ matrix.config.target }}.drvPath')
          deployment_drv=$(nix eval --raw '.#colmenaHive.toplevel.${{ matrix.config.id }}.drvPath')
          printf 'CI: %s\nColmena: %s\n' "$ci_drv" "$deployment_drv"
          test "$ci_drv" = "$deployment_drv"

      - name: Build configuration
        run: |
          nix build ${{ matrix.config.target }} \
            --print-build-logs \
            --show-trace

      - name: Pin critical store paths
        if: >-
          matrix.config.cachix_pins &&
          (github.ref == 'refs/heads/main' || github.actor == 'hakula139')
        env:
          CACHIX_PINS: ${{ toJSON(matrix.config.cachix_pins) }}
        run: |
          set -euo pipefail
          jq -r 'to_entries[] | [.key, .value] | @tsv' <<< "$CACHIX_PINS" |
            while IFS=$'\t' read -r pin_name package; do
              store_path=$(nix eval --raw "${package}.outPath")
              cachix push "$CACHIX_NAME" "$store_path"
              cachix pin "$CACHIX_NAME" "$pin_name" "$store_path" --keep-revisions 2
            done

      - name: Check system closure size
        run: |
          nix path-info -Sh ${{ matrix.config.target }}
