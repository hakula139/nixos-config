name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      validation_ref:
        description: Git ref to validate
        required: false
        type: string
      publish:
        description: Merge a validated flake lock update through a pull request
        required: false
        default: false
        type: boolean

env:
  CACHIX_NAME: hakula
  VALIDATION_REF: ${{ inputs.validation_ref || github.sha }}

jobs:
  flake-check:
    name: Nix Flake Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ env.VALIDATION_REF }}

      - name: Setup Nix
        uses: ./.github/actions/setup-nix
        with:
          cache_prefix: flake-check
          cachix_name: ${{ env.CACHIX_NAME }}
          cachix_skip_push: 'true'

      - name: Run flake check
        run: nix flake check --all-systems

  build:
    name: Build ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.runner }}
    needs: flake-check
    strategy:
      fail-fast: false
      matrix:
        config:
          - id: us-1
            name: us-1 (x86_64-linux, CloudCone SC2)
            runner: ubuntu-latest
            target: .#nixosConfigurations.us-1.config.system.build.toplevel
          - id: us-2
            name: us-2 (x86_64-linux, CloudCone VPS)
            runner: ubuntu-latest
            target: .#nixosConfigurations.us-2.config.system.build.toplevel
          - id: us-3
            name: us-3 (x86_64-linux, CloudCone SC2)
            runner: ubuntu-latest
            target: .#nixosConfigurations.us-3.config.system.build.toplevel
          - id: us-4
            name: us-4 (x86_64-linux, DMIT)
            runner: ubuntu-latest
            target: .#nixosConfigurations.us-4.config.system.build.toplevel
          - id: sg-1
            name: sg-1 (x86_64-linux, Tencent Lighthouse)
            runner: ubuntu-latest
            target: .#nixosConfigurations.sg-1.config.system.build.toplevel
          - id: wsl
            name: wsl (x86_64-linux, NixOS-WSL)
            runner: ubuntu-latest
            target: .#nixosConfigurations.wsl.config.system.build.toplevel
          - id: wsl-non-nixos
            name: wsl-non-nixos (x86_64-linux, System Manager)
            runner: ubuntu-latest
            target: .#systemConfigs.wsl-non-nixos
          - id: macos
            name: macbook (aarch64-darwin, macOS)
            runner: macos-latest
            target: .#darwinConfigurations.macbook.system
          - id: docker
            name: devvm (x86_64-linux, Docker)
            runner: ubuntu-latest
            target: .#packages.x86_64-linux.devvm-docker

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ env.VALIDATION_REF }}

      - name: Setup Nix
        uses: ./.github/actions/setup-nix
        with:
          cache_prefix: ${{ matrix.config.id }}
          cachix_name: ${{ env.CACHIX_NAME }}
          cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          cachix_skip_push: >-
            ${{ !(github.ref == 'refs/heads/main' || github.actor == 'hakula139' || inputs.publish) }}

      - name: Build configuration
        run: |
          nix build ${{ matrix.config.target }} \
            --print-build-logs \
            --show-trace

      - name: Pin critical store paths
        if: >-
          matrix.config.id == 'macos' &&
          (github.ref == 'refs/heads/main' || github.actor == 'hakula139' || inputs.publish)
        run: |
          store_path=$(nix eval --raw '.#darwinConfigurations.macbook.pkgs.peertube-runner.outPath')
          cachix push hakula "$store_path"
          cachix pin hakula peertube-runner "$store_path" --keep-revisions 2

      - name: Check system closure size
        run: |
          nix path-info -Sh ${{ matrix.config.target }}

  publish-flake-lock:
    name: Merge Flake Lock
    if: ${{ inputs.publish }}
    runs-on: ubuntu-latest
    needs:
      - flake-check
      - build
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout validated revision
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ env.VALIDATION_REF }}

      - name: Open and merge update pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PR_TITLE: 'chore(flake): update flake inputs'
          UPDATE_BRANCH: automation/flake-update
        run: |
          git fetch origin main

          if ! git merge-base --is-ancestor origin/main HEAD; then
            echo "main changed while the update was being validated" >&2
            exit 1
          fi

          if [[ $(git rev-list --count origin/main..HEAD) -ne 1 ]]; then
            echo "the update must contain exactly one commit" >&2
            exit 1
          fi

          if [[ $(git diff --name-only origin/main HEAD) != flake.lock ]]; then
            echo "the update must change only flake.lock" >&2
            exit 1
          fi

          while IFS= read -r pr_number; do
            if [[ -n "$pr_number" ]]; then
              gh pr close "$pr_number" --repo "$GITHUB_REPOSITORY"
            fi
          done < <(
            gh pr list \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head "$UPDATE_BRANCH" \
              --state open \
              --json number \
              --jq '.[].number'
          )

          pr_body="$RUNNER_TEMP/flake-update-pr.md"
          printf '%s\n' \
            '## Summary' \
            '' \
            '- Update all flake inputs to their latest revisions.' \
            '' \
            '## Changes' \
            '' \
            '- Refresh flake.lock with nix flake update.' \
            '' \
            '## Design decisions' \
            '' \
            '- Create this pull request only after the generated commit passes the full CI matrix.' \
            '- Close an older unmerged flake update pull request before creating this replacement.' \
            '' \
            '## Test plan' \
            '' \
            '- [x] nix flake check --all-systems' \
            '- [x] Build every NixOS, WSL, system-manager, Darwin, and Docker target' \
            > "$pr_body"

          pr_url=$(
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head "$UPDATE_BRANCH" \
              --title "$PR_TITLE" \
              --body-file "$pr_body" \
              --assignee hakula139 \
              --label ci
          )

          gh pr merge "$pr_url" \
            --repo "$GITHUB_REPOSITORY" \
            --auto \
            --squash \
            --delete-branch \
            --subject "$PR_TITLE" \
            --body 'Update all flake inputs after the full configuration matrix passes.'
